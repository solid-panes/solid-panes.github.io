<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Note — solid-panes demo</title>
<style>
  body { font-family: Inter, -apple-system, sans-serif; background: #f5f5f7; margin: 0; }
  #losos { max-width: 100% !important; }
  .demo-banner { background: #1a1a1a; color: #ddd; padding: 14px 24px; font: 13px/1.5 monospace; }
  .demo-banner a { color: #6366f1; }
  .demo-banner code { color: #fff; }
</style>
</head>
<body>

<div class="demo-banner">
  <strong>solid-panes demo: Note</strong> &middot;
  data declares only <code>"@type": "Note"</code> &middot;
  <a href="https://solid-panes.github.io/auto-schema.js">auto-schema.js</a> looks up the urn:solid:Note manifest, patches in <code>$schema</code> &middot;
  LOSOS schema-pane auto-renders the form
</div>

<!-- 1. Data island — only @type, no $schema. The whole point of this demo. -->
<script type="application/ld+json" src="note-data.jsonld"></script>

<!-- 2. Declare which panes LOSOS should consider -->
<script type="module" data-pane src="https://losos.org/panes/schema-pane.js"></script>
<script type="module" data-pane src="https://losos.org/panes/source-pane.js"></script>

<!-- 3. Mount point -->
<div id="losos"></div>

<!-- 4. Boot: auto-schema first (patches $schema based on @type), THEN shell. -->
<script type="module">
  import { autoSchema } from 'https://solid-panes.github.io/auto-schema.js'
  const result = await autoSchema()
  console.log('[demo] autoSchema patched', result.patched, 'island(s),', result.skipped, 'skipped')
  await import('https://losos.org/losos/shell.js')
</script>

</body>
</html>
